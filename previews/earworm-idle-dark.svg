<rect class="bar" x="816" y="84" width="8" height="40" rx="2" style="animation-delay:-0.48s"/>
<rect class="bar" x="830" y="84" width="8" height="40" rx="2" style="animation-delay:-0.85s"/>
<rect class="bar" x="844" y="84" width="8" height="40" rx="2" style="animation-delay:-0.22s"/>

</svg>